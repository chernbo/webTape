# ------------------------------------------------------------------
# 本地开发环境
#
# 用途:
#   - 只启动 MySQL 作为本地依赖
#   - Next.js 应用用 `pnpm dev` 在宿主机直接跑, 保留热更新 / 断点
#
# 使用:
#   docker compose up -d           # 启动 MySQL
#   docker compose down            # 停止
#   docker compose down -v         # 停止并清空数据 (谨慎)
#
# 应用侧 DATABASE_URL:
#   mysql://<MYSQL_USER>:<MYSQL_PASSWORD>@localhost:3306/<MYSQL_DATABASE>
# ------------------------------------------------------------------

services:
  mysql:
    image: mysql:8.4
    container_name: webtape-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER} -p${MYSQL_PASSWORD} --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
