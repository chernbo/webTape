name: Build & push replayer image

# ------------------------------------------------------------------
# 构建 apps/replayer 的 Docker 镜像并推送到 GHCR，供自建用户一键拉起。
# Build the apps/replayer Docker image and push it to GHCR so self-hosters
# can pull it via the one-command installer (deploy/install.sh).
#
# 触发 / Triggers:
#   - push 到 main 且改动了 apps/replayer/** 或本 workflow
#   - 手动触发 (workflow_dispatch)
#
# 产物 tag / Tags:
#   - ghcr.io/chernbo/webtape-replayer:latest      (default branch)
#   - ghcr.io/chernbo/webtape-replayer:sha-<short> (每次构建)
#
# ⚠️ 首次推送后，GHCR package 默认是 Private。必须在
#    GitHub → Packages → webtape-replayer → Package settings → Change visibility
#    改成 Public，deploy/install.sh 的 `docker compose pull` 才能匿名拉取。
#    After the first push the GHCR package is Private by default — set it to
#    Public in the package settings, otherwise anonymous `docker compose pull` fails.
# ------------------------------------------------------------------

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/replayer/**'
      - '.github/workflows/build-replayer-image.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/chernbo/webtape-replayer

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推送到 GHCR 需要 / required to push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/replayer
          file: ./apps/replayer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 仅 amd64: GitHub runner 原生架构, 无需 QEMU 模拟, 构建快 (arm64 交叉模拟会慢 5~6 倍)
          # amd64 only: native to GitHub runners, no QEMU emulation (arm64 would be 5-6x slower)
          platforms: linux/amd64
