name: Build & push replayer image

# ------------------------------------------------------------------
# 构建 apps/replayer 的 Docker 镜像并推送到 GHCR，供自建用户一键拉起。
# Build the apps/replayer Docker image and push it to GHCR so self-hosters
# can pull it via the one-command installer (deploy/install.sh).
#
# 触发 / Triggers:
#   - push 到 main 且改动了 apps/replayer/** 或本 workflow
#   - 手动触发 (workflow_dispatch)
#
# 产物 tag / Tags:
#   - ghcr.io/chernbo/webtape-replayer:latest      (default branch)
#   - ghcr.io/chernbo/webtape-replayer:sha-<short> (每次构建)
#   同时（若配置了 ACR 凭据）推送到阿里云 ACR 同名 tag，国内服务器拉取更快：
#   Also pushed to Aliyun ACR (same tags) when ACR credentials are configured:
#   - crpi-tcyd1jihicxiwzp4.cn-beijing.personal.cr.aliyuncs.com/webtape-replayer/webtape-replayer:{latest,sha-<short>}
#
# 需要的 Secrets / Required secrets (仓库 Settings → Secrets and variables → Actions):
#   - ACR_USERNAME : 阿里云容器镜像服务的登录用户名（个人版通常是阿里云账号全名/RAM 用户名）
#   - ACR_PASSWORD : ACR 访问凭证密码（在 ACR 控制台「访问凭证」里设置的固定密码）
#   未配置这两个 Secret 时，会自动跳过 ACR、只推 GHCR（fork 也不会失败）。
#   Without these secrets the ACR push is skipped and only GHCR is pushed (forks won't fail).
#
# ⚠️ 首次推送后，GHCR package 默认是 Private。必须在
#    GitHub → Packages → webtape-replayer → Package settings → Change visibility
#    改成 Public，deploy/install.sh 的 `docker compose pull` 才能匿名拉取。
#    After the first push the GHCR package is Private by default — set it to
#    Public in the package settings, otherwise anonymous `docker compose pull` fails.
# ------------------------------------------------------------------

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/replayer/**'
      - '.github/workflows/build-replayer-image.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/chernbo/webtape-replayer
  # 阿里云 ACR 镜像地址（公网域名，供 GitHub runner 从境外推送；服务器内网拉取用 -vpc 域名即可）
  # Aliyun ACR image (public endpoint; the server can still pull via the -vpc endpoint)
  ACR_IMAGE: crpi-tcyd1jihicxiwzp4.cn-beijing.personal.cr.aliyuncs.com/webtape-replayer/webtape-replayer
  ACR_REGISTRY: crpi-tcyd1jihicxiwzp4.cn-beijing.personal.cr.aliyuncs.com

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推送到 GHCR 需要 / required to push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 检测是否配置了 ACR 凭据（仓库 Settings → Secrets: ACR_USERNAME / ACR_PASSWORD）。
      # 没配（如别人 fork）就跳过 ACR，只推 GHCR，不会让 workflow 失败。
      # Detect ACR credentials; skip ACR push (GHCR only) if they are absent (e.g. in forks).
      - name: Detect ACR credentials
        id: acr
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
        run: |
          if [ -n "$ACR_USERNAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ACR_USERNAME not set — skipping Aliyun ACR push, pushing to GHCR only."
          fi

      - name: Login to Aliyun ACR
        if: steps.acr.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 一次 metadata 同时为 GHCR 与 ACR 生成 tag：ACR 未启用时只保留 GHCR 那一个镜像名。
      # Compute tags for GHCR (+ ACR when enabled) in one shot.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            name=${{ env.IMAGE_NAME }}
            name=${{ env.ACR_IMAGE }},enable=${{ steps.acr.outputs.enabled == 'true' }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/replayer
          file: ./apps/replayer/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 仅 amd64: GitHub runner 原生架构, 无需 QEMU 模拟, 构建快 (arm64 交叉模拟会慢 5~6 倍)
          # amd64 only: native to GitHub runners, no QEMU emulation (arm64 would be 5-6x slower)
          platforms: linux/amd64
